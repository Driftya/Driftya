<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driftya Mood Navigation Demo</title>
  <style>
    :root {
      --driftya-accent: #5ee6ff;
      --driftya-text: #f5f7ff;
      --driftya-muted: rgba(220, 228, 255, 0.72);
      --stage-gradient: radial-gradient(140% 120% at 15% 10%, rgba(255, 255, 255, 0.2), rgba(88, 122, 255, 0.25), rgba(6, 10, 34, 0.95));
      --glass-border: rgba(255, 255, 255, 0.12);
      --shadow: rgba(3, 6, 19, 0.48);
      --caption-max: 36rem;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--driftya-text);
      background:
        radial-gradient(80% 62% at 50% 102%, rgba(94, 230, 255, 0.08), transparent 72%),
        var(--stage-gradient);
      overflow: hidden;
    }

    .layout {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 2.6vw, 2rem);
    }

    .stage {
      position: relative;
      width: min(96vw, 1120px);
      height: min(90vh, 760px);
      border-radius: 1.4rem;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(40% 30% at 22% 18%, rgba(94, 230, 255, 0.06), transparent 72%),
        radial-gradient(44% 34% at 78% 24%, rgba(94, 230, 255, 0.04), transparent 74%),
        linear-gradient(180deg, rgba(10, 14, 34, 0.78), rgba(6, 10, 27, 0.92));
      box-shadow: 0 1.1rem 2.8rem var(--shadow);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.08) 0 0.4%, transparent 1.1%),
        radial-gradient(circle at 74% 14%, rgba(255, 255, 255, 0.07) 0 0.32%, transparent 0.95%),
        radial-gradient(circle at 61% 40%, rgba(255, 255, 255, 0.04) 0 0.22%, transparent 0.82%),
        radial-gradient(circle at 28% 72%, rgba(255, 255, 255, 0.06) 0 0.28%, transparent 0.96%);
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .topbar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 2;
      padding: clamp(1rem, 2.4vw, 1.5rem);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 1rem;
      pointer-events: none;
    }

    .topbar-spacer {
      min-height: 1px;
    }

    .caption-panel {
      width: min(100%, var(--caption-max));
      border: 1px solid var(--glass-border);
      border-radius: 1.2rem;
      padding: 1rem 1.15rem 1.05rem;
      background: linear-gradient(180deg, rgba(15, 21, 48, 0.72), rgba(10, 15, 38, 0.84));
      backdrop-filter: blur(14px);
      box-shadow: 0 0.8rem 2rem rgba(2, 6, 18, 0.28);
      text-align: center;
      justify-self: center;
    }

    .caption-line {
      margin: 0;
      font-size: clamp(1rem, 1.55vw, 1.24rem);
      line-height: 1.35;
      letter-spacing: 0.01em;
      transition: opacity 220ms ease, color 220ms ease, transform 220ms ease;
      text-wrap: balance;
    }

    .caption-line + .caption-line {
      margin-top: 0.28rem;
    }

    .caption-line.is-primary {
      color: rgba(245, 247, 255, 0.98);
      opacity: 1;
      transform: translateY(0);
    }

    .caption-line.is-secondary {
      color: var(--driftya-muted);
      opacity: 0.58;
      transform: translateY(0.18rem);
    }

    .caption-status {
      margin: 0.5rem 0 0;
      font-size: 0.84rem;
      line-height: 1.3;
      letter-spacing: 0.02em;
      color: rgba(94, 230, 255, 0.9);
      opacity: 0.9;
    }

    .brand-overlay {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(12, 17, 39, 0.54);
      box-shadow: 0 0.5rem 1.2rem rgba(3, 6, 18, 0.18);
    }

    .brand-overlay img {
      width: auto;
      height: 1.2rem;
      display: block;
    }

    .brand-overlay span {
      font-size: 0.88rem;
      letter-spacing: 0.01em;
      color: rgba(245, 247, 255, 0.92);
    }

    .origin-badge {
      position: absolute;
      left: 50%;
      bottom: clamp(2rem, 5vh, 3.4rem);
      transform: translateX(-50%);
      z-index: 2;
      min-width: 8rem;
      padding: 0.72rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, rgba(22, 29, 58, 0.88), rgba(13, 19, 42, 0.9));
      color: rgba(245, 247, 255, 0.92);
      font-size: 0.92rem;
      text-align: center;
      letter-spacing: 0.01em;
      box-shadow: 0 0.7rem 1.6rem rgba(4, 8, 22, 0.26);
      pointer-events: none;
    }

    .origin-badge span {
      color: rgba(94, 230, 255, 0.92);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .stage {
        height: min(92vh, 760px);
      }

      .topbar {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      .caption-panel {
        width: 100%;
      }

      .brand-overlay {
        justify-self: end;
      }

      .origin-badge {
        bottom: 1.6rem;
        min-width: 7.2rem;
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <h1 class="sr-only">Mood navigation constellation with five mood icons and a guided message path</h1>

    <section class="stage" aria-label="Mood navigation constellation demo">
      <canvas class="scene" id="scene" aria-hidden="true"></canvas>

      <div class="topbar" aria-hidden="true">
        <div class="topbar-spacer"></div>

        <div class="caption-panel">
          <p class="caption-line is-primary" id="captionPrimary">Choose a mood.</p>
          <p class="caption-line is-secondary" id="captionSecondary">Let it guide your words.</p>
          <p class="caption-status" id="captionStatus">A note can move with a softer route.</p>
        </div>

        <div class="brand-overlay">
          <img src="../assets/logo/logo_with_title_dark.png" alt="Driftya">
        </div>
      </div>

      <div class="origin-badge" aria-hidden="true">&#9993; <span>note</span></div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const captionPrimary = document.getElementById("captionPrimary");
      const captionSecondary = document.getElementById("captionSecondary");
      const captionStatus = document.getElementById("captionStatus");
      if (!canvas || !captionPrimary || !captionSecondary || !captionStatus) return;

      const context = canvas.getContext("2d");
      if (!context) return;

      const colors = {
        accent: "#5ee6ff",
        accentSoft: "rgba(94, 230, 255, 0.28)",
        accentGlow: "rgba(94, 230, 255, 0.18)",
        text: "#f5f7ff",
        muted: "rgba(220, 228, 255, 0.56)",
        nodeFill: "rgba(17, 24, 52, 0.9)",
        nodeBorder: "rgba(255, 255, 255, 0.14)",
        line: "rgba(220, 228, 255, 0.12)"
      };

      const moodNodes = [
        {
          id: "soft",
          label: "soft",
          iconPath: "../assets/icons/cloud.svg",
          x: 0.2,
          y: 0.28,
          driftX: 9,
          driftY: 13,
          phase: 0.25,
          destination: { x: 0.77, y: 0.16 }
        },
        {
          id: "quiet",
          label: "quiet",
          iconPath: "../assets/icons/moon.svg",
          x: 0.34,
          y: 0.64,
          driftX: 10,
          driftY: 15,
          phase: 1.4,
          destination: { x: 0.74, y: 0.76 }
        },
        {
          id: "heavy",
          label: "heavy",
          iconPath: "../assets/icons/anchor.svg",
          x: 0.54,
          y: 0.8,
          driftX: 8,
          driftY: 9,
          phase: 2.2,
          destination: { x: 0.52, y: 0.9 }
        },
        {
          id: "bright",
          label: "bright",
          iconPath: "../assets/icons/sparkles.svg",
          x: 0.77,
          y: 0.56,
          driftX: 13,
          driftY: 10,
          phase: 3.35,
          destination: { x: 0.24, y: 0.72 }
        },
        {
          id: "restless",
          label: "restless",
          iconPath: "../assets/icons/wind.svg",
          x: 0.71,
          y: 0.24,
          driftX: 15,
          driftY: 9,
          phase: 4.4,
          destination: { x: 0.18, y: 0.18 }
        }
      ];

      const constellationLinks = [
        ["soft", "quiet"],
        ["soft", "restless"],
        ["quiet", "heavy"],
        ["heavy", "bright"],
        ["bright", "restless"]
      ];

      const selectionOrder = ["soft", "quiet", "heavy", "bright", "restless"];
      const cycleMs = 15200;
      const selectionStart = 1400;
      const routeRevealStart = 3600;
      const routeRevealEnd = 6700;
      const travelStart = 7200;
      const travelEnd = 11300;
      const fadeOutStart = 13200;
      const baseStars = Array.from({ length: 30 }, (_, index) => ({
        x: ((index * 97) % 1000) / 1000,
        y: ((index * 173) % 1000) / 1000,
        size: 1 + (((index * 11) % 10) / 10) * 1.8,
        phase: index * 0.33
      }));

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let origin = { x: 0, y: 0 };
      let iconImages = new Map();
      let tintCanvas = null;
      let tintContext = null;
      let animationStarted = false;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const resize = () => {
        const bounds = canvas.getBoundingClientRect();
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, Math.round(bounds.width));
        height = Math.max(1, Math.round(bounds.height));
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        if (!tintCanvas) {
          tintCanvas = document.createElement("canvas");
          tintContext = tintCanvas.getContext("2d");
        }
        origin = {
          x: width * 0.5,
          y: height * 0.88
        };
      };

      const getNodeById = (id) => moodNodes.find((node) => node.id === id);

      const loadIcons = () => Promise.all(
        moodNodes.map((node) => new Promise((resolve) => {
          const image = new Image();
          image.onload = () => {
            iconImages.set(node.id, image);
            resolve();
          };
          image.onerror = () => resolve();
          image.src = node.iconPath;
        }))
      );

      const getNodePosition = (node, timeMs) => {
        const t = timeMs / 1000;
        return {
          x: width * node.x + Math.sin(t * 0.8 + node.phase) * node.driftX,
          y: height * node.y + Math.cos(t * 0.68 + node.phase) * node.driftY
        };
      };

      const sampleQuadratic = (start, control, end, steps) => {
        const points = [];
        for (let index = 0; index <= steps; index += 1) {
          const t = index / steps;
          const inverse = 1 - t;
          points.push({
            x: (inverse * inverse * start.x) + (2 * inverse * t * control.x) + (t * t * end.x),
            y: (inverse * inverse * start.y) + (2 * inverse * t * control.y) + (t * t * end.y)
          });
        }
        return points;
      };

      const buildRoute = (nodePosition, destinationPoint) => {
        const controlOne = {
          x: origin.x + ((nodePosition.x - origin.x) * 0.42) + ((nodePosition.x < origin.x ? -1 : 1) * width * 0.04),
          y: origin.y - (height * 0.28)
        };
        const controlTwo = {
          x: nodePosition.x + ((destinationPoint.x - nodePosition.x) * 0.48),
          y: Math.min(nodePosition.y, destinationPoint.y) - (height * 0.12)
        };

        return sampleQuadratic(origin, controlOne, nodePosition, 46)
          .concat(sampleQuadratic(nodePosition, controlTwo, destinationPoint, 38).slice(1));
      };

      const getPointAlongRoute = (points, progress) => {
        if (points.length === 0) return origin;
        if (progress <= 0) return points[0];
        if (progress >= 1) return points[points.length - 1];

        const scaled = progress * (points.length - 1);
        const index = Math.floor(scaled);
        const fraction = scaled - index;
        const pointA = points[index];
        const pointB = points[index + 1] || pointA;

        return {
          x: pointA.x + ((pointB.x - pointA.x) * fraction),
          y: pointA.y + ((pointB.y - pointA.y) * fraction)
        };
      };

      const drawPill = (x, y, widthPx, heightPx, radius) => {
        if (typeof context.roundRect === "function") {
          context.beginPath();
          context.roundRect(x, y, widthPx, heightPx, radius);
          return;
        }

        const r = Math.min(radius, widthPx / 2, heightPx / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + widthPx, y, x + widthPx, y + heightPx, r);
        context.arcTo(x + widthPx, y + heightPx, x, y + heightPx, r);
        context.arcTo(x, y + heightPx, x, y, r);
        context.arcTo(x, y, x + widthPx, y, r);
      };

      const drawBackdrop = (timeMs) => {
        const glow = context.createRadialGradient(width * 0.52, height * 0.42, 0, width * 0.52, height * 0.42, width * 0.62);
        glow.addColorStop(0, "rgba(94, 230, 255, 0.03)");
        glow.addColorStop(1, "rgba(94, 230, 255, 0)");
        context.fillStyle = glow;
        context.fillRect(0, 0, width, height);

        for (const star of baseStars) {
          const alpha = 0.28 + ((Math.sin((timeMs / 1000) * 0.9 + star.phase) + 1) * 0.18);
          context.beginPath();
          context.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
          context.arc(width * star.x, height * star.y, star.size, 0, Math.PI * 2);
          context.fill();
        }
      };

      const drawConstellation = (positions) => {
        context.save();
        context.lineWidth = 1.2;
        context.strokeStyle = colors.line;
        context.setLineDash([4, 9]);

        for (const [fromId, toId] of constellationLinks) {
          const from = positions[fromId];
          const to = positions[toId];
          if (!from || !to) continue;

          context.beginPath();
          context.moveTo(from.x, from.y);
          context.lineTo(to.x, to.y);
          context.stroke();
        }

        context.restore();
      };

      const drawNode = (node, position, selected, pulse) => {
        const radius = Math.max(26, Math.min(width, height) * 0.04) + (selected ? 3 : 0);
        const glowRadius = radius * (selected ? 2.3 + (pulse * 0.16) : 1.45);

        const halo = context.createRadialGradient(position.x, position.y, radius * 0.18, position.x, position.y, glowRadius);
        halo.addColorStop(0, selected ? "rgba(94, 230, 255, 0.42)" : "rgba(94, 230, 255, 0.09)");
        halo.addColorStop(1, "rgba(94, 230, 255, 0)");
        context.fillStyle = halo;
        context.beginPath();
        context.arc(position.x, position.y, glowRadius, 0, Math.PI * 2);
        context.fill();

        if (selected) {
          context.beginPath();
          context.strokeStyle = "rgba(94, 230, 255, 0.5)";
          context.lineWidth = 1.6;
          context.arc(position.x, position.y, radius * (1.22 + (pulse * 0.05)), 0, Math.PI * 2);
          context.stroke();
        }

        context.beginPath();
        context.fillStyle = colors.nodeFill;
        context.strokeStyle = selected ? colors.accent : colors.nodeBorder;
        context.lineWidth = selected ? 2.2 : 1.2;
        context.arc(position.x, position.y, radius, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        const iconImage = iconImages.get(node.id);
        if (iconImage && iconImage.complete && tintCanvas && tintContext) {
          const size = radius * 1.04;
          const tintSize = Math.max(1, Math.ceil(size * pixelRatio));
          tintCanvas.width = tintSize;
          tintCanvas.height = tintSize;
          tintContext.setTransform(1, 0, 0, 1, 0, 0);
          tintContext.clearRect(0, 0, tintSize, tintSize);
          tintContext.drawImage(iconImage, 0, 0, tintSize, tintSize);
          tintContext.globalCompositeOperation = "source-in";
          tintContext.fillStyle = "#f5f7ff";
          tintContext.fillRect(0, 0, tintSize, tintSize);
          tintContext.globalCompositeOperation = "source-over";

          context.save();
          context.globalAlpha = selected ? 1 : 0.88;
          context.drawImage(tintCanvas, position.x - (size / 2), position.y - (size / 2), size, size);
          context.restore();
        }

        if (selected) {
          context.font = '600 13px "Space Grotesk", "Segoe UI", Arial, sans-serif';
          const labelWidth = Math.max(82, context.measureText(node.label).width + 24);
          const labelHeight = 28;
          const labelX = position.x - (labelWidth / 2);
          const labelY = position.y + radius + 16;

          drawPill(labelX, labelY, labelWidth, labelHeight, 999);
          context.fillStyle = "rgba(10, 16, 38, 0.9)";
          context.fill();
          context.strokeStyle = "rgba(94, 230, 255, 0.28)";
          context.lineWidth = 1;
          context.stroke();

          context.fillStyle = "rgba(245, 247, 255, 0.94)";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillText(node.label, position.x, labelY + (labelHeight / 2) + 0.5);
        }
      };

      const drawOrigin = (pulse) => {
        const radius = Math.max(7, Math.min(width, height) * 0.012);

        context.beginPath();
        context.fillStyle = "rgba(245, 247, 255, 0.94)";
        context.arc(origin.x, origin.y, radius + (pulse * 0.4), 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.fillStyle = colors.accentSoft;
        context.arc(origin.x, origin.y, radius * 2.6 + (pulse * 1.1), 0, Math.PI * 2);
        context.fill();
      };

      const drawRoute = (points, revealProgress) => {
        if (revealProgress <= 0 || points.length < 2) return;

        const visibleCount = Math.max(2, Math.floor(points.length * revealProgress));

        context.save();
        context.lineCap = "round";
        context.lineJoin = "round";
        context.lineWidth = 2.2;
        context.strokeStyle = colors.accent;
        context.shadowColor = "rgba(94, 230, 255, 0.24)";
        context.shadowBlur = 14;
        context.setLineDash([1, 0]);

        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < visibleCount; index += 1) {
          context.lineTo(points[index].x, points[index].y);
        }
        context.stroke();

        context.lineWidth = 6;
        context.strokeStyle = colors.accentGlow;
        context.shadowBlur = 0;
        context.stroke();
        context.restore();
      };

      const drawMessage = (point, travelProgress) => {
        const glowRadius = 18 + (travelProgress * 4);
        const halo = context.createRadialGradient(point.x, point.y, 0, point.x, point.y, glowRadius);
        halo.addColorStop(0, "rgba(94, 230, 255, 0.52)");
        halo.addColorStop(1, "rgba(94, 230, 255, 0)");
        context.fillStyle = halo;
        context.beginPath();
        context.arc(point.x, point.y, glowRadius, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.fillStyle = colors.text;
        context.arc(point.x, point.y, 5.8, 0, Math.PI * 2);
        context.fill();
      };

      const setCaptions = (secondaryActive, statusText) => {
        captionPrimary.className = secondaryActive ? "caption-line is-secondary" : "caption-line is-primary";
        captionSecondary.className = secondaryActive ? "caption-line is-primary" : "caption-line is-secondary";
        captionStatus.textContent = statusText;
      };

      const getSceneState = (cycleProgressMs, selectedNode) => {
        let routeReveal = 0;
        let travel = 0;
        let showMessage = false;
        let secondaryActive = false;
        let statusText = "A note can move with a softer route.";

        if (cycleProgressMs >= selectionStart && cycleProgressMs < routeRevealStart) {
          statusText = `${selectedNode.label} settles first.`;
        } else if (cycleProgressMs >= routeRevealStart && cycleProgressMs < travelStart) {
          routeReveal = clamp((cycleProgressMs - routeRevealStart) / (routeRevealEnd - routeRevealStart), 0, 1);
          statusText = `${selectedNode.label} opens the route.`;
        } else if (cycleProgressMs >= travelStart) {
          routeReveal = 1;
          travel = clamp((cycleProgressMs - travelStart) / (travelEnd - travelStart), 0, 1);
          showMessage = true;
          secondaryActive = true;
          statusText = `The note follows the ${selectedNode.label} path.`;
        }

        return {
          routeReveal,
          travel,
          showMessage,
          secondaryActive,
          statusText
        };
      };

      const renderFrame = (timeMs) => {
        context.clearRect(0, 0, width, height);
        drawBackdrop(timeMs);

        const positions = {};
        for (const node of moodNodes) {
          positions[node.id] = getNodePosition(node, timeMs);
        }

        drawConstellation(positions);
        drawOrigin((Math.sin((timeMs / 1000) * 2.2) + 1) * 0.5);

        const currentCycle = Math.floor(timeMs / cycleMs);
        const cycleProgressMs = timeMs % cycleMs;
        const selectedId = selectionOrder[currentCycle % selectionOrder.length];
        const selectedNode = getNodeById(selectedId);
        const selectedPosition = positions[selectedId];
        const destination = {
          x: width * selectedNode.destination.x,
          y: height * selectedNode.destination.y
        };
        const routePoints = buildRoute(selectedPosition, destination);
        const sceneState = getSceneState(cycleProgressMs, selectedNode);

        if (cycleProgressMs >= fadeOutStart) {
          const fade = 1 - clamp((cycleProgressMs - fadeOutStart) / (cycleMs - fadeOutStart), 0, 1);
          context.save();
          context.globalAlpha = fade;
          drawRoute(routePoints, sceneState.routeReveal);
          context.restore();
        } else {
          drawRoute(routePoints, sceneState.routeReveal);
        }

        for (const node of moodNodes) {
          const selected = node.id === selectedId && cycleProgressMs >= selectionStart;
          const pulse = 0.92 + (((Math.sin((timeMs / 1000) * 2.4) + 1) * 0.5) * 0.24);
          drawNode(node, positions[node.id], selected, pulse);
        }

        if (sceneState.showMessage) {
          drawMessage(getPointAlongRoute(routePoints, sceneState.travel), sceneState.travel);
        }

        setCaptions(sceneState.secondaryActive, sceneState.statusText);
      };

      const animate = (now) => {
        renderFrame(now);
        window.requestAnimationFrame(animate);
      };

      const start = () => {
        if (animationStarted) return;
        animationStarted = true;
        resize();
        window.requestAnimationFrame(animate);
      };

      window.addEventListener("resize", resize);

      Promise.all([
        document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
        loadIcons()
      ]).then(start);
    })();
  </script>
</body>
